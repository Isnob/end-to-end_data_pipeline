x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: crypto-airflow:2.7.0-python3.11

x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:password@db/crypto_db
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
  AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
  AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY: "2"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d crypto_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-image
    # Команда инициализации: создает базу и юзера airflow/airflow
    command: >
      bash -c "airflow db migrate && (airflow users create --username airflow --firstname Bogdan --lastname Leonov --role Admin --email admin@example.com --password airflow || true)"
    environment:
      <<: *airflow-env
    depends_on:
      db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-image
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    environment:
      <<: *airflow-env
    ports:
      - "127.0.0.1:8080:8080"

  airflow-scheduler:
    <<: *airflow-image
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    environment:
      <<: *airflow-env

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    image: crypto-dbt:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dbt:/dbt
    profiles:
      - tools
    environment:
      DBT_PROFILES_DIR: /dbt
    ports:
      - "127.0.0.1:8081:8081"