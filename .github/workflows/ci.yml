name: CI

on:
  push:
    branches:
      - main
      - demo
  pull_request:
    branches:
      - main
      - demo

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Check DAG Python syntax
        run: PYTHONDONTWRITEBYTECODE=1 python -m py_compile dags/main_dag.py

      - name: Build Airflow image
        run: docker compose build airflow-scheduler

      - name: Prepare Airflow log directory
        run: mkdir -p logs/scheduler && chmod -R 777 logs

      - name: Import Airflow DAG
        run: >
          docker compose run --rm --no-deps --entrypoint python airflow-scheduler
          -c "import sys; sys.path.insert(0, '/opt/airflow/dags'); import main_dag"

      - name: Build dbt image
        run: docker compose build dbt

      - name: Parse dbt project
        run: docker compose run --rm --no-deps dbt parse

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/demo'

    steps:
      - name: Deploy demo to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/end-to-end_data_pipeline
            git pull --ff-only origin demo
            docker compose up -d --build
            docker compose ps
